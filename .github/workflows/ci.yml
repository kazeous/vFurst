name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions: { contents: read }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vfurst?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Type-check
        run: npx turbo run type-check --concurrency=1

      - name: Lint
        run: npx turbo run lint --concurrency=1

      - name: Test
        run: npx turbo run test --concurrency=1

      - name: Compose validator tests
        run: npm run test:compose

      - name: Validate production Compose
        run: npm run compose:validate

      - name: Smoke developer boot without injected app env
        run: npm run test:boot-config

      - name: Build
        run: npm run build

  arm64-images:
    # Native arm64 runner (free for public repositories): no QEMU emulation.
    # Builds only to the cache; Coolify builds the deployed images itself.
    name: Production images (linux/arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web, worker, and migrate for linux/arm64
        run: |
          for target in web worker migrate; do
            docker buildx build --platform linux/arm64 --target "$target" \
              --build-arg SOURCE_COMMIT="${GITHUB_SHA}" --output type=cacheonly .
          done
