$schema: https://json-schema.org/draft/2020-12/schema
$id: https://vfurst.reyuugames.com/schemas/webhooks.yaml
title: vFurst Webhook Events
type: object
description: Outbound webhook event envelope used for organization webhook endpoints.
required:
  - id
  - type
  - orgId
  - createdAt
  - data
properties:
  id:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - event.published
      - registration.created
      - registration.checked_in
      - order.paid
      - order.refunded
      - hotel_booking.created
      - volunteer_application.submitted
      - vendor_application.submitted
  orgId:
    type: string
    format: uuid
  eventId:
    type: string
    format: uuid
  createdAt:
    type: string
    format: date-time
  data:
    oneOf:
      - $ref: "#/$defs/eventPayload"
      - $ref: "#/$defs/registrationPayload"
      - $ref: "#/$defs/orderPayload"
      - $ref: "#/$defs/hotelBookingPayload"
      - $ref: "#/$defs/applicationPayload"
$defs:
  eventPayload:
    type: object
    required: [eventId]
    properties:
      eventId:
        type: string
        format: uuid
  registrationPayload:
    type: object
    required: [registrationId, userId]
    properties:
      registrationId:
        type: string
        format: uuid
      userId:
        type: string
        format: uuid
  orderPayload:
    type: object
    required: [orderId, total, platformFee]
    properties:
      orderId:
        type: string
        format: uuid
      total:
        type: integer
        minimum: 0
      platformFee:
        type: integer
        minimum: 0
  hotelBookingPayload:
    type: object
    required: [hotelBookingId, blockId, userId]
    properties:
      hotelBookingId:
        type: string
        format: uuid
      blockId:
        type: string
        format: uuid
      userId:
        type: string
        format: uuid
  applicationPayload:
    type: object
    required: [applicationId, userId]
    properties:
      applicationId:
        type: string
        format: uuid
      userId:
        type: string
        format: uuid
