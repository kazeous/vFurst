openapi: 3.1.0
info:
  title: vFurst REST API
  version: 0.1.0
  description: Public REST contract for the vFurst convention management platform.
servers:
  - url: https://vfurst.reyuugames.com/api/v1
    description: Production
  - url: https://staging.vfurst.reyuugames.com/api/v1
    description: Staging
security:
  - apiKeyAuth: []
tags:
  - name: Organizations
  - name: Events
  - name: Registrations
  - name: Orders
  - name: Webhooks
paths:
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations visible to the authenticated API key.
      operationId: listOrganizations
      responses:
        "200":
          description: Organizations returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
  /organizations/{orgId}:
    get:
      tags: [Organizations]
      summary: Get an organization by id.
      operationId: getOrganization
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations/{orgId}/events:
    get:
      tags: [Events]
      summary: List events for an organization.
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Events returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get an event by id.
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
  /events/{eventId}/registration-types:
    get:
      tags: [Registrations]
      summary: List registration tiers for an event.
      operationId: listRegistrationTypes
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Registration types returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistrationType"
  /events/{eventId}/registrations:
    get:
      tags: [Registrations]
      summary: List registrations for an event.
      operationId: listRegistrations
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Registrations returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Registration"
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get an order by id.
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations/{orgId}/webhook-endpoints:
    get:
      tags: [Webhooks]
      summary: List outbound webhook endpoints.
      operationId: listWebhookEndpoints
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Webhook endpoints returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEndpoint"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use `Bearer vf_live_...` or `Bearer vf_test_...`.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Organization:
      type: object
      required: [id, name, slug, subdomain, contactEmail]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        subdomain:
          type: string
        logo:
          type: [string, "null"]
          format: uri
        contactEmail:
          type: string
          format: email
        customDomain:
          type: [string, "null"]
    Event:
      type: object
      required: [id, orgId, name, slug, startDate, endDate, status, settings]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        venue:
          type: [string, "null"]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        settings:
          $ref: "#/components/schemas/EventSettings"
    EventSettings:
      type: object
      required: [requireApproval, allowTransfers, maxRegistrationsPerUser]
      properties:
        requireApproval:
          type: boolean
        allowTransfers:
          type: boolean
        maxRegistrationsPerUser:
          type: integer
          minimum: 1
        emailProviderId:
          type: string
    RegistrationType:
      type: object
      required: [id, orgId, eventId, name, price, scheduledPricing]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
          minimum: 0
          description: Price in cents.
        maxCapacity:
          type: [integer, "null"]
          minimum: 1
        scheduledPricing:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledPrice"
    ScheduledPrice:
      type: object
      required: [startDate, endDate, price]
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        price:
          type: integer
          minimum: 0
    Registration:
      type: object
      required: [id, orgId, eventId, userId, typeId, status]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          description: "Portal account ID of the attendee, scoped to the API key's organization (Phase 1B; formerly a platform user ID)."
          type: string
          format: uuid
        typeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, TRANSFERRED, CHECKED_IN]
        checkedInAt:
          type: [string, "null"]
          format: date-time
        badgeNumber:
          type: [string, "null"]
    Order:
      type: object
      required: [id, orgId, userId, eventId, total, platformFee, status]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        userId:
          description: "Portal account ID of the attendee, scoped to the API key's organization (Phase 1B; formerly a platform user ID)."
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        total:
          type: integer
          minimum: 0
          description: Total in cents.
        platformFee:
          type: integer
          minimum: 0
          description: Platform fee in cents, collected through Stripe application fees.
        status:
          type: string
          enum: [PENDING, PAID, REFUNDED, CANCELLED, FAILED]
        stripePaymentIntentId:
          type: [string, "null"]
    WebhookEndpoint:
      type: object
      required: [id, orgId, url, events, active]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
