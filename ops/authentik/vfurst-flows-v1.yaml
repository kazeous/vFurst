# Target: authentik 2025.10+; live rollout uses 2026.8.4. Install flows before binding the provider.
# No existing default flow, source, user, group or application is modified.
version: 1
metadata:
  name: vFurst - OIDC evidence v1
entries:
  - model: authentik_flows.flow
    id: vfurst-authentication
    identifiers: {slug: vfurst-authentication-v1}
    attrs:
      name: vFurst authentication
      # authentik appends " - <brand title>" in the tab, so no brand name here.
      title: Sign in
      designation: authentication
      authentication: none
  - model: authentik_stages_identification.identificationstage
    id: vfurst-identification
    identifiers: {name: vfurst-identification-v1}
    attrs:
      user_fields: [email, username]
  - model: authentik_stages_password.passwordstage
    id: vfurst-password
    identifiers: {name: vfurst-password-v1}
    attrs:
      backends: [authentik.core.auth.InbuiltBackend]
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: vfurst-totp
    identifiers: {name: vfurst-totp-v1}
    attrs:
      device_classes: [totp, webauthn]
      not_configured_action: skip
      last_auth_threshold: seconds=0
  - model: authentik_stages_user_login.userloginstage
    id: vfurst-login
    identifiers: {name: vfurst-login-v1}
    attrs:
      session_duration: hours=12
      remember_me_offset: seconds=0
      terminate_other_sessions: false
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf vfurst-authentication, stage: !KeyOf vfurst-identification, order: 10}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf vfurst-authentication, stage: !KeyOf vfurst-password, order: 20}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf vfurst-authentication, stage: !KeyOf vfurst-totp, order: 30}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf vfurst-authentication, stage: !KeyOf vfurst-login, order: 100}

  - model: authentik_flows.flow
    id: vfurst-invalidation
    identifiers: {slug: vfurst-invalidation-v1}
    attrs:
      name: vFurst single logout
      title: Signed out
      designation: invalidation
      authentication: none
  - model: authentik_stages_user_logout.userlogoutstage
    id: vfurst-logout
    identifiers: {name: vfurst-user-logout-v1}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf vfurst-invalidation, stage: !KeyOf vfurst-logout, order: 10}

  - model: authentik_flows.flow
    id: vfurst-authorization
    identifiers: {slug: vfurst-authorization-v1}
    attrs:
      name: Authorize vFurst
      title: Continue to vFurst
      designation: authorization
      authentication: require_authenticated
  - model: authentik_stages_email.emailstage
    id: vfurst-email
    identifiers: {name: vfurst-email-verification-v1}
    attrs:
      # Use the studio's existing global SMTP transport, as the old vFurst
      # verification stage does. Credentials remain outside this blueprint.
      use_global_settings: true
      activate_user_on_success: false
      token_expiry: minutes=10
      subject: Verify your email for your reyuuGAMES Account
      # Install the persistent studio branding bundle on server and worker first.
      template: reyuugames/account_confirmation.html
  - model: authentik_stages_consent.consentstage
    id: vfurst-consent
    identifiers: {name: vfurst-consent-v1}
    attrs: {mode: permanent}
  - model: authentik_flows.flowstagebinding
    id: vfurst-email-binding
    identifiers: {target: !KeyOf vfurst-authorization, stage: !KeyOf vfurst-email, order: 10}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: true}
  - model: authentik_flows.flowstagebinding
    id: vfurst-consent-binding
    identifiers: {target: !KeyOf vfurst-authorization, stage: !KeyOf vfurst-consent, order: 20}
    attrs: {evaluate_on_plan: true, re_evaluate_policies: true}
  - model: authentik_policies_expression.expressionpolicy
    id: vfurst-email-needed
    identifiers: {name: vfurst-email-needed-v1}
    attrs:
      expression: |
        from hashlib import sha256
        from django.utils.timezone import now
        from authentik.events.models import Event
        plan = request.context.get("flow_plan")
        if not plan or not request.user.is_authenticated or not request.user.email:
            return True
        user = request.user
        digest = sha256((str(user.uuid) + ":" + user.email).encode("utf-8")).hexdigest()
        verified = Event.objects.filter(action="custom_vfurst_email_verified_v1", user__pk=user.pk,
            context__address_digest=digest, expires__gt=now()).exists()
        if verified:
            return False
        # Never replace this snapshot when restoring a verification link.
        plan.context.setdefault("vfurst_email_snapshot_v1", user.email)
        plan.context["pending_user"] = user
        plan.context["email"] = plan.context["vfurst_email_snapshot_v1"]
        return True
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf vfurst-email-binding, policy: !KeyOf vfurst-email-needed, order: 10}
    attrs: {failure_result: true}
  - model: authentik_policies_expression.expressionpolicy
    id: vfurst-email-record
    identifiers: {name: vfurst-email-record-v1}
    attrs:
      expression: |
        from hashlib import sha256
        from django.utils.timezone import now
        from authentik.events.models import Event
        plan = request.context.get("flow_plan")
        if not plan or not request.user.is_authenticated:
            return True
        user = request.user
        current_digest = sha256((str(user.uuid) + ":" + user.email).encode("utf-8")).hexdigest()
        if Event.objects.filter(action="custom_vfurst_email_verified_v1", user__pk=user.pk,
            context__address_digest=current_digest, expires__gt=now()).exists():
            return True
        snapshot = plan.context.get("vfurst_email_snapshot_v1")
        restored = plan.context.get("is_restored")
        if (snapshot and snapshot == user.email and restored and restored.user_id == user.pk
            and restored.flow.slug == "vfurst-authorization-v1"
            and plan.context.get("pending_user") == user):
            digest = sha256((str(user.uuid) + ":" + snapshot).encode("utf-8")).hexdigest()
            if not Event.objects.filter(action="custom_vfurst_email_verified_v1", user__pk=user.pk,
                context__address_digest=digest, expires__gt=now()).exists():
                # Do not copy request query parameters, authorization codes or tokens into audit logs.
                # Use the full custom action explicitly; Event.new otherwise adds custom_.
                event = Event(action="custom_vfurst_email_verified_v1", app="vfurst",
                    context={"address_digest": digest})
                event.set_user(user)
                event.save()
            return True
        # Recording verification must not remove the consent stage while a
        # restored email flow is running. Consent keeps its own stable lifecycle.
        return True
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf vfurst-consent-binding, policy: !KeyOf vfurst-email-record, order: 10}
    attrs: {failure_result: false}
  - model: authentik_providers_oauth2.scopemapping
    identifiers: {name: vfurst-email-evidence-v1}
    attrs:
      scope_name: email
      description: Email verified for vFurst
      expression: |
        from hashlib import sha256
        from django.utils.timezone import now
        from authentik.events.models import Event
        digest = sha256((str(user.uuid) + ":" + user.email).encode("utf-8")).hexdigest()
        verified = bool(user.is_active and user.email and Event.objects.filter(
            action="custom_vfurst_email_verified_v1", user__pk=user.pk,
            context__address_digest=digest, expires__gt=now()).exists())
        return {"email": user.email, "email_verified": verified}
  - model: authentik_providers_oauth2.scopemapping
    identifiers: {name: vfurst-assurance-v1}
    attrs:
      scope_name: vfurst_assurance
      description: Authentication evidence for vFurst
      expression: |
        from authentik.events.signals import get_login_event
        from authentik.stages.authenticator_totp.models import TOTPDevice
        event = get_login_event(token.session)
        if not event or event.user.get("pk") != user.pk:
            return {}
        method = event.context.get("auth_method")
        if method == "password":
            primary_method = "password"
        elif event.context.get("source"):
            primary_method = "source"
        else:
            return {}
        from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
        validated = event.context.get("auth_method_args", {}).get("mfa_devices", [])
        # A second factor is a confirmed TOTP or WebAuthn device of this user that this login validated.
        mfa_ids = {("authentik_stages_authenticator_totp", "totpdevice", pk)
            for pk in TOTPDevice.objects.filter(user=user, confirmed=True).values_list("pk", flat=True)}
        mfa_ids.update(("authentik_stages_authenticator_webauthn", "webauthndevice", pk)
            for pk in WebAuthnDevice.objects.filter(user=user, confirmed=True).values_list("pk", flat=True))
        mfa = any(isinstance(d, dict) and (d.get("app"), d.get("model_name"), d.get("pk")) in mfa_ids
            for d in validated)
        # Both values describe completion of this session's real authentication event.
        # They never use token issuance time or a device's mutable last-used time.
        primary_at = int(event.created.timestamp())
        if primary_at != int(token.auth_time.timestamp()):
            return {}
        return {"name": user.name, "vfurst_assurance": {"version": 1, "policy": "vfurst-v1",
            "primary_at": primary_at, "primary_method": primary_method,
            "mfa_enrolled": bool(mfa_ids), "mfa_at": primary_at if mfa else None}}
