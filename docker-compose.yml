services:
  postgres:
    image: postgres:16-alpine
    container_name: vfurst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfurst
    ports:
      - "5432:5432"
    volumes:
      - vfurst-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vfurst"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vfurst-postgres-data:
