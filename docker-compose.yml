services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=100
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfurst
    ports:
      - "5432:5432"
    volumes:
      - vfurst_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vfurst_redis_data:/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - vfurst_minio_data:/data

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # Stand-in for the studio authentik in local development and E2E. Any subject
  # and claims can be entered on its interactive sign-in form.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    restart: unless-stopped
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: '{"interactiveLogin":true,"httpServer":"NettyWrapper"}'
    ports:
      - "8090:8090"

volumes:
  vfurst_postgres_data:
  vfurst_redis_data:
  vfurst_minio_data:
